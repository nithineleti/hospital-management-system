<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siri AI - Hospital Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header { 
            padding: 20px; 
            background: rgba(0,212,255,0.1);
            border-bottom: 1px solid rgba(0,212,255,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h2 { font-size: 20px; font-weight: 600; }
        .close-btn { 
            margin-left: auto; 
            background: none; 
            border: none; 
            color: white; 
            font-size: 24px; 
            cursor: pointer; 
            padding: 4px 8px; 
            border-radius: 50%; 
            transition: background 0.2s; 
        }
        .close-btn:hover { background: rgba(255,255,255,0.1); }
        .chat-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 18px; 
            max-width: 80%; 
            animation: fadeIn 0.3s; 
        }
        .message.user { 
            background: linear-gradient(135deg, #00d4ff, #0099cc); 
            align-self: flex-end; 
            margin-left: auto;
        }
        .message.ai { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(0,212,255,0.3);
            backdrop-filter: blur(10px);
        }
        .typing { opacity: 0.7; font-style: italic; }
        .input-area { 
            padding: 20px; 
            background: rgba(255,255,255,0.05);
            border-top: 1px solid rgba(0,212,255,0.3);
            display: flex;
            gap: 12px;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px 20px; 
            border: 1px solid rgba(0,212,255,0.3); 
            border-radius: 25px; 
            background: rgba(255,255,255,0.1); 
            color: white; 
            font-size: 16px;
            outline: none;
        }
        input[type="text"]::placeholder { color: rgba(255,255,255,0.6); }
        .send-btn { 
            background: linear-gradient(135deg, #00d4ff, #0099cc); 
            border: none; 
            border-radius: 50%; 
            width: 48px; 
            height: 48px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.2s; 
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn svg { width: 24px; height: 24px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { .message { max-width: 90%; font-size: 14px; } }
    </style>
</head>
<body>
    <div class="header">
        <h2>🏥 Siri AI Assistant</h2>
        <button class="close-btn" onclick="parent.toggleSiriFrame()" title="Close">×</button>
    </div>
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            Hello! I'm Siri, your hospital management assistant. Ask me about patients, appointments, doctors, or any medical help.
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Ask Siri anything..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <script>
        let eventSource = null;

        function addMessage(content, isUser = false) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            messageDiv.textContent = content;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true);
            input.value = '';

            // POST to backend SSE
            fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message }),
                credentials: 'include'  // Include auth cookies
            }).then(response => {
                if (!response.ok) {
                    addMessage('Sorry, AI service unavailable. Check console.');
                    return;
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let result = '';

                function read() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            return;
                        }
                        const chunk = decoder.decode(value, { stream: true });
                        result += chunk;
                        addMessage(result, false);
                        read();
                    }).catch(err => {
                        console.error('Stream error:', err);
                        addMessage('Connection lost. Try again.');
                    });
                }
                read();
            }).catch(err => {
                console.error('Fetch error:', err);
                addMessage('Network error. Please refresh.');
            });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Expose for parent widget
        window.toggleSiriFrame = () => parent.toggleSiriFrame();

        // Focus input
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
