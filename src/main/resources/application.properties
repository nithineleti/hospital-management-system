spring.application.name=Hospital Management System

# Server Configuration
# Cloud Run requires listening on the PORT env var
server.port=${PORT:8080}
server.servlet.context-path=/hospital

# --- DATABASE CONFIGURATION ---
# Use H2 by default for local dev, but allow GCP overrides via env vars
# NOTE: if you see IPv6 lookup errors ("connection refused" on localhost) set the
# datasource URL to an explicit IPv4 address or force IPv4 using JVM flags.
# example: SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3306/hospital_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# If using MySQL set this, else default will be auto-detected by Spring Boot for H2
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# For explicit MySQL deploy from env example:
# export SPRING_DATASOURCE_URL='jdbc:mysql://HOST:3306/hospital_db?useSSL=false&serverTimezone=UTC'
# export SPRING_DATASOURCE_USERNAME='admin'
# export SPRING_DATASOURCE_PASSWORD='Hospital,123'
# export SPRING_DATASOURCE_DRIVER='com.mysql.cj.jdbc.Driver'

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- THYMELEAF & LOGGING (Your existing settings are fine) ---
spring.thymeleaf.cache=false
logging.level.com.hospital=DEBUG

# --- GEMINI AI AGENT CONFIGURATION ---
# Replace with your actual Gemini API endpoint and API key
# Recommended modern endpoint (v1):
# https://generativeai.googleapis.com/v1/models/gemini-1.5-mini:generate
# You can also set a URL via env var: GEMINI_API_URL
gemini.api.url=${GEMINI_API_URL:}
# Use environment variable for safety: export GEMINI_API_KEY='your-key'
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_PLACEHOLDER}
# Optionally override model name (used when gemini.api.url is blank):
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-mini}